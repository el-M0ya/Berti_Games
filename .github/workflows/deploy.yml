name: Deploy to GitHub Pages

# Solo los chequeos que protegen los DATOS bloquean el deploy.
# Los tests unitarios viven en tests.yml: si uno falla, avisa, pero no deja
# la web caida. (Ya paso: un test que no podia correr bajo Node 20 tumbo el
# deploy entero y el sitio se quedo sirviendo el repositorio crudo.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy a la vez. El grupo "pages" es el mismo que usa GitHub para
# su propia pagina, asi que esto no se pisa con nada.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 y no 20: los tests usan node:sqlite, que aparece en 22.5.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check text encoding
        run: python tools/check_text.py

      - name: Check catalog file format
        run: python tools/check_format.py

      - name: Check hidden characters
        run: python tools/find_line_separators.py

      - name: Check normalizer is idempotent
        # Si normalize_catalog.py cambiara los archivos en cada corrida, el
        # repositorio se ensuciaria solo con cada build. Pasa cuando todo bien.
        run: python tools/check_idempotent.py

      - name: Verify the build output exists
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::No se genero dist/index.html"
            exit 1
          fi
          # Si el HTML apunta a /src/, es el archivo de desarrollo y no el
          # build: seria publicar una pagina en blanco.
          if grep -q 'src="/src/main.jsx"' dist/index.html; then
            echo "::error::dist/index.html apunta a /src/main.jsx: no es un build"
            exit 1
          fi
          echo "dist/index.html correcto"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4